<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120"
     role="img" aria-label="UCBAZZAR UC coin badge">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset=".55" stop-color="#ffb020"/>
      <stop offset="1" stop-color="#ff6a00"/>
    </linearGradient>
    <radialGradient id="coin" cx="35%" cy="28%" r="78%">
      <stop offset="0" stop-color="#ffeeb8"/>
      <stop offset=".5" stop-color="#ffb020"/>
      <stop offset="1" stop-color="#c97600"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161a24"/>
      <stop offset="1" stop-color="#0a0c12"/>
    </linearGradient>
  </defs>

  <rect width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="3" y="3" width="114" height="114" rx="25" fill="none"
        stroke="url(#ring)" stroke-opacity=".5" stroke-width="2"/>

  <!-- background grid -->
  <g stroke="#ffb020" stroke-opacity=".07" stroke-width="1">
    <path d="M0 30h120M0 60h120M0 90h120M30 0v120M60 0v120M90 0v120"/>
  </g>

  <!-- coin -->
  <circle cx="60" cy="53" r="29" fill="url(#coin)" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
  <circle cx="60" cy="53" r="20.5" fill="none" stroke="#2a1b00" stroke-opacity=".3" stroke-width="2"/>
  <text x="60" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="21" font-weight="bold" fill="#2a1b00">UC</text>

  <!-- 3 small coins -->
  <circle cx="20" cy="94" r="7" fill="#ffb020" opacity=".85"/>
  <circle cx="36" cy="100" r="9" fill="#ffd166" opacity=".9"/>
  <circle cx="54" cy="96" r="6" fill="#ff9a1f" opacity=".8"/>

  <text x="72" y="101" font-family="Arial, Helvetica, sans-serif" font-size="11"
        font-weight="bold" letter-spacing="1.1" fill="#ffb020">BAZZAR</text>
</svg>
