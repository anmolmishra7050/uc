# Simple workflow for deploying static content to GitHub Pages
# (GitHub → Actions → "Static HTML": "Deploy static files in a repository without a build")
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main", "master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress
# and latest queued. However, do NOT cancel in-progress runs as we want to allow these
# production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Sirf website ki files publish hoti hain. README.md, GO-LIVE.md,
      # tools/ aur .freebuff/ repo me rahenge par live site par public URL
      # nahi banenge (pehle poora repo upload hota tha).
      # ⚠️ Root me koi NAYA file add karo (jaise ek naya image ya page) to
      #    neeche wali list me uska naam bhi daal dena, warna wo live nahi jayega.
      - name: Build site folder
        run: |
          mkdir -p dist
          cp -r index.html assets robots.txt sitemap.xml CNAME .nojekyll dist/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # sirf website folder upload karo — poora repo nahi
          path: 'dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
